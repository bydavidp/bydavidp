name: Generate 3D contributions

on:
  schedule:
    - cron: "0 1 * * *"   # diario, 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Generar SVGs 3D
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit y push a la rama profile-3d-contrib
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B profile-3d-contrib
          git add -A
          git commit -m "generate 3d contrib"
          git push origin profile-3d-contrib --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
